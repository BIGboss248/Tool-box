services:
  watchtower:
    image: nickfedor/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    container_name: watchtower
    hostname: watchtower
    networks:
      - my_network
    environment:
      # Cron scheduling for updates (6-field 6-digit cron: sec min hour day month day-of-week)
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - WATCHTOWER_CLEANUP=true
      # Only update containers with label com.centurylinklabs.watchtower.enable=true
      - WATCHTOWER_LABEL_ENABLE=true
    healthcheck:
      test: ["CMD", "/watchtower", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  my_network:
    driver: bridge
    name: my_network
    