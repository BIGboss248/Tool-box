# Scraping the Nexora panel metrics endpoint.
global:
  scrape_interval: 60s
  scrape_timeout: 15s

scrape_configs:
  - job_name: nexora-panel
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/token
    scheme: http
    static_configs:
      - targets: ['panel:2095']

