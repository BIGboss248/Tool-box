---
services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    hostname: hermes
    restart: unless-stopped
    command: gateway run
    volumes:
      # Holds config.yaml, .env, sessions, memory and skills. Back this up.
      - ./data:/opt/data
    environment:
      - HERMES_HOME=/opt/data
      - TZ=${TZ:-Asia/Tehran}
      # OpenCode Go subscription. The active provider and model live in data/config.yaml.
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:-}
      # Telegram
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS:-}
      # Web dashboard (port 9119 in the container), published by Traefik
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_PUBLIC_URL=https://${DOMAIN}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USERNAME:-}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD:-}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_SECRET:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hermes.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.hermes.entrypoints=websecure"
      - "traefik.http.routers.hermes.tls=true"
      - "traefik.http.routers.hermes.tls.certresolver=${CERT_RESOLVER:-cloudflare_resolver}"
      - "traefik.http.services.hermes.loadbalancer.server.port=9119"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9119/api/status >/dev/null || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - my_network

networks:
  my_network:
    driver: bridge
    name: my_network
