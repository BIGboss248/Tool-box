#kics-scan disable=d6355c88-1e8d-49e9-b2f2-f8a1ca12c75b,1c1325ff-831d-43a1-973e-839ae57dfcc0
services:
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:latest}
    container_name: traefik
    hostname: traefik
    restart: unless-stopped
    command:
      # Healthcheck
      - "--ping=true"

      # API & Dashboard
      - "--api.dashboard=true"
      # Secure mode: disable insecure mode so dashboard isn't exposed publicly without auth
      - "--api.insecure=false"

      # Docker Provider
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${DOCKER_NETWORK:-my_network}"

      # Log Level
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"

      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      # Observability / Metrics
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=websecure"
      - "--metrics.prometheus.addrouterslabels=true"
      - "--metrics.prometheus.addserviceslabels=true"

      # Access Logs
      - "--accesslog=true"
      - "--accesslog.format=${TRAEFIK_ACCESS_LOG_FORMAT:-json}"
      - "--accesslog.filepath=/logs/access.log"

      # Certificate Resolvers
      ## HTTP Challenge (Let's Encrypt HTTP-01)
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL:-}"
      - "--certificatesresolvers.myresolver.acme.storage=/acme.json"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      # - "--certificatesresolvers.myresolver.acme.caServer=https://acme-staging-v02.api.letsencrypt.org/directory"

      ## Cloudflare DNS Challenge (Let's Encrypt DNS-01 - supports wildcard certificates)
      - "--certificatesresolvers.cloudflare_resolver.acme.email=${ACME_EMAIL:-}"
      - "--certificatesresolvers.cloudflare_resolver.acme.storage=/acme.json"
      - "--certificatesresolvers.cloudflare_resolver.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare_resolver.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53"
      # - "--certificatesresolvers.cloudflare_resolver.acme.caServer=https://acme-staging-v02.api.letsencrypt.org/directory"

    ports:
      - "80:80"
      - "443:443"

    environment:
      CF_API_EMAIL: ${CF_API_EMAIL:-}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
      CF_ZONE_API_TOKEN: ${CF_ZONE_API_TOKEN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      PROM_METRICS_PATH: ${PROM_METRICS_PATH:-}

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acme.json:/acme.json:rw
      - ./logs:/logs:rw

    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 3s

    networks:
      - my_network

    labels:
      - "traefik.enable=${TRAEFIK_DASHBOARD_ENABLE:-true}"
      - "traefik.docker.network=${DOCKER_NETWORK:-my_network}"

      # Dashboard HTTPS Router
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_DASHBOARD_DOMAIN}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=${TRAEFIK_DASHBOARD_CERTRESOLVER:-myresolver}"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth,dashboard-compress"

      # Authentication Middleware (Basic Auth from .env)
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_BASIC_AUTH_USERS}"

      # Compression Middleware
      - "traefik.http.middlewares.dashboard-compress.compress=true"

networks:
  my_network:
    name: ${DOCKER_NETWORK:-my_network}
    driver: bridge
